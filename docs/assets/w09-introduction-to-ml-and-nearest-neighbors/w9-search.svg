<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 615" width="1000" height="615" role="img" aria-labelledby="title desc"><title id="title">Search: represent the problem before solving it</title><desc id="desc">From the 7 October lecture transcript (AI Search segment).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087e8b"/></marker></defs><rect width="1000" height="615" rx="20" fill="#f7fafc"/><g font-family="Arial, sans-serif"><text x="36" y="50" fill="#172c3d" font-size="30" font-weight="700" text-anchor="start">Search: represent the problem before solving it</text><text x="36" y="87" fill="#506477" font-size="20" font-weight="400" text-anchor="start">From the 7 October lecture transcript (AI Search segment).</text><rect x="40" y="150" width="270" height="140" rx="16" fill="white" stroke="#087e8b" stroke-width="2"/><text x="62" y="188" fill="#087e8b" font-size="25" font-weight="700" text-anchor="start">State s</text><text x="62" y="223" fill="#506477" font-size="21" font-weight="400" text-anchor="start">Current state</text><text x="62" y="252" fill="#506477" font-size="21" font-weight="400" text-anchor="start">Starting point</text><rect x="365" y="150" width="270" height="140" rx="16" fill="white" stroke="#087e8b" stroke-width="2"/><text x="387" y="188" fill="#087e8b" font-size="25" font-weight="700" text-anchor="start">Action a</text><text x="387" y="223" fill="#506477" font-size="21" font-weight="400" text-anchor="start">One available choice</text><text x="387" y="252" fill="#506477" font-size="21" font-weight="400" text-anchor="start">Choose from</text><text x="387" y="281" fill="#506477" font-size="21" font-weight="400" text-anchor="start">actions(s)</text><rect x="690" y="150" width="270" height="140" rx="16" fill="white" stroke="#087e8b" stroke-width="2"/><text x="712" y="188" fill="#087e8b" font-size="25" font-weight="700" text-anchor="start">Next state</text><text x="712" y="223" fill="#506477" font-size="21" font-weight="400" text-anchor="start">result(s, a)</text><text x="712" y="252" fill="#506477" font-size="21" font-weight="400" text-anchor="start">Transition model</text><text x="712" y="281" fill="#506477" font-size="21" font-weight="400" text-anchor="start">output</text><path d="M312 215 L355 215" fill="none" stroke="#087e8b" stroke-width="3" marker-end="url(#arrow)"/><path d="M637 215 L680 215" fill="none" stroke="#087e8b" stroke-width="3" marker-end="url(#arrow)"/><rect x="165" y="360" width="670" height="155" rx="16" fill="white" stroke="#087e8b" stroke-width="2"/><text x="187" y="398" fill="#087e8b" font-size="25" font-weight="700" text-anchor="start">Goal test + path cost</text><text x="187" y="433" fill="#506477" font-size="21" font-weight="400" text-anchor="start">Does this state satisfy the goal?</text><text x="187" y="462" fill="#506477" font-size="21" font-weight="400" text-anchor="start">Compare solutions by the sum of action costs.</text><path d="M825 295 L825 345" fill="none" stroke="#087e8b" stroke-width="3" marker-end="url(#arrow)"/><text x="500" y="570" fill="#087e8b" font-size="22" font-weight="700" text-anchor="middle">Search finds a sequence of actions from an initial state to a goal.</text></g></svg>