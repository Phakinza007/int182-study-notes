<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" width="1000" height="610" role="img" aria-labelledby="title desc"><title id="title">k-NN: neighbors vote for the label</title><desc id="desc">Schematic illustrating the k = 3 versus k = 5 principle in the supplied decks.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087e8b"/></marker></defs><rect width="1000" height="610" rx="20" fill="#f7fafc"/><g font-family="Arial, sans-serif"><text x="36" y="50" fill="#172c3d" font-size="30" font-weight="700" text-anchor="start">k-NN: neighbors vote for the label</text><text x="36" y="87" fill="#506477" font-size="20" font-weight="400" text-anchor="start">Schematic illustrating the k = 3 versus k = 5 principle in the supplied decks.</text><circle cx="330" cy="335" r="150" fill="#edf8f9" stroke="#087e8b" stroke-dasharray="7 7"/><circle cx="330" cy="335" r="95" fill="none" stroke="#087e8b" stroke-width="2"/><circle cx="295" cy="300" r="13" fill="#c24c45"/><circle cx="370" cy="360" r="13" fill="#c24c45"/><circle cx="340" cy="390" r="13" fill="#2563eb"/><circle cx="220" cy="260" r="13" fill="#2563eb"/><circle cx="435" cy="245" r="13" fill="#2563eb"/><circle cx="520" cy="420" r="13" fill="#c24c45"/><circle cx="140" cy="480" r="13" fill="#2563eb"/><path d="M330 316 L349 335 L330 354 L311 335 Z" fill="#172c3d"/><text x="355" y="329" fill="#172c3d" font-size="20" font-weight="400" text-anchor="start">Query</text><rect x="590" y="155" width="365" height="145" rx="16" fill="white" stroke="#c24c45" stroke-width="2"/><text x="612" y="193" fill="#c24c45" font-size="25" font-weight="700" text-anchor="start">k = 3</text><text x="612" y="228" fill="#506477" font-size="21" font-weight="400" text-anchor="start">2 red + 1 blue</text><text x="612" y="257" fill="#506477" font-size="21" font-weight="400" text-anchor="start">Majority vote → RED</text><rect x="590" y="340" width="365" height="145" rx="16" fill="white" stroke="#2563eb" stroke-width="2"/><text x="612" y="378" fill="#2563eb" font-size="25" font-weight="700" text-anchor="start">k = 5</text><text x="612" y="413" fill="#506477" font-size="21" font-weight="400" text-anchor="start">2 red + 3 blue</text><text x="612" y="442" fill="#506477" font-size="21" font-weight="400" text-anchor="start">Majority vote → BLUE</text><text x="500" y="565" fill="#506477" font-size="22" font-weight="400" text-anchor="middle">Small k: flexible, noise sensitive. Large k: smoother, may underfit.</text></g></svg>