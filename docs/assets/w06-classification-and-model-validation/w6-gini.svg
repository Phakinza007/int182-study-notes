<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" role="img" aria-labelledby="title desc"><title id="title">Decision tree: compare a candidate split</title><desc id="desc">A worked example from Classification and Metrics, pp. 12-16.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087e8b"/></marker></defs><rect width="1000" height="620" rx="20" fill="#f7fafc"/><g font-family="Arial, sans-serif"><text x="36" y="50" fill="#172c3d" font-size="30" font-weight="700" text-anchor="start">Decision tree: compare a candidate split</text><text x="36" y="87" fill="#506477" font-size="20" font-weight="400" text-anchor="start">A worked example from Classification and Metrics, pp. 12-16.</text><rect x="330" y="125" width="340" height="105" rx="16" fill="white" stroke="#087e8b" stroke-width="2"/><text x="352" y="163" fill="#087e8b" font-size="25" font-weight="700" text-anchor="start">10 houses</text><text x="352" y="198" fill="#506477" font-size="21" font-weight="400" text-anchor="start">5 High, 5 Low; Gini 0.50</text><path d="M410 232 L240 300" fill="none" stroke="#087e8b" stroke-width="3" marker-end="url(#arrow)"/><path d="M590 232 L760 300" fill="none" stroke="#087e8b" stroke-width="3" marker-end="url(#arrow)"/><rect x="45" y="315" width="420" height="160" rx="16" fill="white" stroke="#087e8b" stroke-width="2"/><text x="67" y="353" fill="#087e8b" font-size="25" font-weight="700" text-anchor="start">Good neighborhood</text><text x="67" y="388" fill="#506477" font-size="21" font-weight="400" text-anchor="start">4 High + 1 Low</text><text x="67" y="417" fill="#506477" font-size="21" font-weight="400" text-anchor="start">Gini = 1 - (0.8² + 0.2²) = 0.32</text><rect x="535" y="315" width="420" height="160" rx="16" fill="white" stroke="#087e8b" stroke-width="2"/><text x="557" y="353" fill="#087e8b" font-size="25" font-weight="700" text-anchor="start">Not good neighborhood</text><text x="557" y="388" fill="#506477" font-size="21" font-weight="400" text-anchor="start">1 High + 4 Low</text><text x="557" y="417" fill="#506477" font-size="21" font-weight="400" text-anchor="start">Gini = 1 - (0.2² + 0.8²) = 0.32</text><text x="500" y="535" fill="#087e8b" font-size="24" font-weight="700" text-anchor="middle">Weighted Gini = 0.5 × 0.32 + 0.5 × 0.32 = 0.32</text><text x="500" y="578" fill="#506477" font-size="21" font-weight="400" text-anchor="middle">Choose the candidate split with the lowest weighted impurity.</text></g></svg>