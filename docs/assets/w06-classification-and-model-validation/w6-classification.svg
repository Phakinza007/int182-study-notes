<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" width="1000" height="550" role="img" aria-labelledby="title desc"><title id="title">Classification: what is the output?</title><desc id="desc">Based on Classification and Metrics, pp. 4 and 35-40.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087e8b"/></marker></defs><rect width="1000" height="550" rx="20" fill="#f7fafc"/><g font-family="Arial, sans-serif"><text x="36" y="50" fill="#172c3d" font-size="30" font-weight="700" text-anchor="start">Classification: what is the output?</text><text x="36" y="87" fill="#506477" font-size="20" font-weight="400" text-anchor="start">Based on Classification and Metrics, pp. 4 and 35-40.</text><rect x="36" y="130" width="270" height="130" rx="16" fill="white" stroke="#087e8b" stroke-width="2"/><text x="58" y="168" fill="#087e8b" font-size="25" font-weight="700" text-anchor="start">Input features</text><text x="58" y="203" fill="#506477" font-size="21" font-weight="400" text-anchor="start">Numeric or encoded</text><text x="58" y="232" fill="#506477" font-size="21" font-weight="400" text-anchor="start">categorical values</text><rect x="365" y="130" width="270" height="130" rx="16" fill="white" stroke="#087e8b" stroke-width="2"/><text x="387" y="168" fill="#087e8b" font-size="25" font-weight="700" text-anchor="start">Classifier</text><text x="387" y="203" fill="#506477" font-size="21" font-weight="400" text-anchor="start">Learn from labeled</text><text x="387" y="232" fill="#506477" font-size="21" font-weight="400" text-anchor="start">examples</text><rect x="694" y="130" width="270" height="130" rx="16" fill="white" stroke="#087e8b" stroke-width="2"/><text x="716" y="168" fill="#087e8b" font-size="25" font-weight="700" text-anchor="start">Class output</text><text x="716" y="203" fill="#506477" font-size="21" font-weight="400" text-anchor="start">Assign labels to</text><text x="716" y="232" fill="#506477" font-size="21" font-weight="400" text-anchor="start">unseen data</text><path d="M308 195 L356 195" fill="none" stroke="#087e8b" stroke-width="3" marker-end="url(#arrow)"/><path d="M637 195 L685 195" fill="none" stroke="#087e8b" stroke-width="3" marker-end="url(#arrow)"/><rect x="36" y="320" width="290" height="190" rx="16" fill="white" stroke="#087e8b" stroke-width="2"/><text x="58" y="358" fill="#087e8b" font-size="25" font-weight="700" text-anchor="start">Binary</text><text x="58" y="393" fill="#506477" font-size="21" font-weight="400" text-anchor="start">Two possible classes</text><text x="58" y="422" fill="#506477" font-size="21" font-weight="400" text-anchor="start">One label per example</text><text x="58" y="451" fill="#506477" font-size="21" font-weight="400" text-anchor="start">Spam / Not spam</text><rect x="355" y="320" width="290" height="190" rx="16" fill="white" stroke="#087e8b" stroke-width="2"/><text x="377" y="358" fill="#087e8b" font-size="25" font-weight="700" text-anchor="start">Multi-class</text><text x="377" y="393" fill="#506477" font-size="21" font-weight="400" text-anchor="start">More than two classes</text><text x="377" y="422" fill="#506477" font-size="21" font-weight="400" text-anchor="start">One label per example</text><text x="377" y="451" fill="#506477" font-size="21" font-weight="400" text-anchor="start">Red / Green / Blue</text><rect x="674" y="320" width="290" height="190" rx="16" fill="white" stroke="#087e8b" stroke-width="2"/><text x="696" y="358" fill="#087e8b" font-size="25" font-weight="700" text-anchor="start">Multi-label</text><text x="696" y="393" fill="#506477" font-size="21" font-weight="400" text-anchor="start">Zero or more labels</text><text x="696" y="422" fill="#506477" font-size="21" font-weight="400" text-anchor="start">Several may apply</text><text x="696" y="451" fill="#506477" font-size="21" font-weight="400" text-anchor="start">Dog + Cat + Bird</text></g></svg>