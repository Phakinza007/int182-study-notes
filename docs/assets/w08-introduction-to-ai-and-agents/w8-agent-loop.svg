<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" width="1000" height="590" role="img" aria-labelledby="title desc"><title id="title">An agent perceives and acts</title><desc id="desc">Based on Introduction to AI, pp. 19-20.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087e8b"/></marker></defs><rect width="1000" height="590" rx="20" fill="#f7fafc"/><g font-family="Arial, sans-serif"><text x="36" y="50" fill="#172c3d" font-size="30" font-weight="700" text-anchor="start">An agent perceives and acts</text><text x="36" y="87" fill="#506477" font-size="20" font-weight="400" text-anchor="start">Based on Introduction to AI, pp. 19-20.</text><rect x="40" y="150" width="265" height="190" rx="16" fill="white" stroke="#087e8b" stroke-width="2"/><text x="62" y="188" fill="#087e8b" font-size="25" font-weight="700" text-anchor="start">Environment</text><text x="62" y="223" fill="#506477" font-size="21" font-weight="400" text-anchor="start">The world outside</text><text x="62" y="252" fill="#506477" font-size="21" font-weight="400" text-anchor="start">the agent</text><text x="62" y="281" fill="#506477" font-size="21" font-weight="400" text-anchor="start">Sends percepts</text><text x="62" y="310" fill="#506477" font-size="21" font-weight="400" text-anchor="start">Responds to actions</text><rect x="380" y="150" width="240" height="190" rx="16" fill="white" stroke="#087e8b" stroke-width="2"/><text x="402" y="188" fill="#087e8b" font-size="25" font-weight="700" text-anchor="start">Agent</text><text x="402" y="223" fill="#506477" font-size="21" font-weight="400" text-anchor="start">Perceives the</text><text x="402" y="252" fill="#506477" font-size="21" font-weight="400" text-anchor="start">world</text><text x="402" y="281" fill="#506477" font-size="21" font-weight="400" text-anchor="start">Chooses a</text><text x="402" y="310" fill="#506477" font-size="21" font-weight="400" text-anchor="start">rational action</text><rect x="695" y="150" width="265" height="190" rx="16" fill="white" stroke="#087e8b" stroke-width="2"/><text x="717" y="188" fill="#087e8b" font-size="25" font-weight="700" text-anchor="start">Actuators</text><text x="717" y="223" fill="#506477" font-size="21" font-weight="400" text-anchor="start">Carry out actions</text><text x="717" y="252" fill="#506477" font-size="21" font-weight="400" text-anchor="start">Physical or digital</text><text x="717" y="281" fill="#506477" font-size="21" font-weight="400" text-anchor="start">output</text><path d="M307 215 L370 215" fill="none" stroke="#087e8b" stroke-width="3" marker-end="url(#arrow)"/><path d="M623 215 L685 215" fill="none" stroke="#087e8b" stroke-width="3" marker-end="url(#arrow)"/><text x="345" y="190" fill="#087e8b" font-size="19" font-weight="400" text-anchor="middle">Sensors</text><path d="M830 345 L830 425 L165 425 L165 345" fill="none" stroke="#087e8b" stroke-width="3" marker-end="url(#arrow)"/><text x="500" y="470" fill="#087e8b" font-size="22" font-weight="700" text-anchor="middle">Actions affect the world → new percepts → next decision</text><text x="500" y="545" fill="#506477" font-size="22" font-weight="400" text-anchor="middle">Rational action: maximize expected utility with available information.</text></g></svg>