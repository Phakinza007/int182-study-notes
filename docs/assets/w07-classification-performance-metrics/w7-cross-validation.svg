<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-labelledby="title desc"><title id="title">3-fold cross validation</title><desc id="desc">Every development example is used for validation once in one complete round.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087e8b"/></marker></defs><rect width="1000" height="640" rx="20" fill="#f7fafc"/><g font-family="Arial, sans-serif"><text x="36" y="50" fill="#172c3d" font-size="30" font-weight="700" text-anchor="start">3-fold cross validation</text><text x="36" y="87" fill="#506477" font-size="20" font-weight="400" text-anchor="start">Every development example is used for validation once in one complete round.</text><rect x="36" y="130" width="280" height="120" rx="16" fill="white" stroke="#087e8b" stroke-width="2"/><text x="58" y="168" fill="#087e8b" font-size="25" font-weight="700" text-anchor="start">Reserve final test</text><text x="58" y="203" fill="#506477" font-size="21" font-weight="400" text-anchor="start">Evaluate only once</text><path d="M320 182 L363 182" fill="none" stroke="#087e8b" stroke-width="3" marker-end="url(#arrow)"/><rect x="375" y="130" width="589" height="120" rx="16" fill="white" stroke="#087e8b" stroke-width="2"/><text x="397" y="168" fill="#087e8b" font-size="25" font-weight="700" text-anchor="start">Development data</text><text x="397" y="203" fill="#506477" font-size="21" font-weight="400" text-anchor="start">Rotate the validation fold; train on the</text><text x="397" y="232" fill="#506477" font-size="21" font-weight="400" text-anchor="start">remaining folds.</text><text x="43" y="319" fill="#172c3d" font-size="23" font-weight="700" text-anchor="start">Round 1</text><rect x="215" y="280" width="230" height="65" rx="12" fill="#087e8b"/><text x="330" y="321" fill="white" font-size="22" font-weight="700" text-anchor="middle">Fold 1: Validate</text><rect x="465" y="280" width="230" height="65" rx="12" fill="#2563eb"/><text x="580" y="321" fill="white" font-size="22" font-weight="700" text-anchor="middle">Fold 2: Train</text><rect x="715" y="280" width="230" height="65" rx="12" fill="#2563eb"/><text x="830" y="321" fill="white" font-size="22" font-weight="700" text-anchor="middle">Fold 3: Train</text><text x="43" y="410" fill="#172c3d" font-size="23" font-weight="700" text-anchor="start">Round 2</text><rect x="215" y="371" width="230" height="65" rx="12" fill="#2563eb"/><text x="330" y="412" fill="white" font-size="22" font-weight="700" text-anchor="middle">Fold 1: Train</text><rect x="465" y="371" width="230" height="65" rx="12" fill="#087e8b"/><text x="580" y="412" fill="white" font-size="22" font-weight="700" text-anchor="middle">Fold 2: Validate</text><rect x="715" y="371" width="230" height="65" rx="12" fill="#2563eb"/><text x="830" y="412" fill="white" font-size="22" font-weight="700" text-anchor="middle">Fold 3: Train</text><text x="43" y="501" fill="#172c3d" font-size="23" font-weight="700" text-anchor="start">Round 3</text><rect x="215" y="462" width="230" height="65" rx="12" fill="#2563eb"/><text x="330" y="503" fill="white" font-size="22" font-weight="700" text-anchor="middle">Fold 1: Train</text><rect x="465" y="462" width="230" height="65" rx="12" fill="#2563eb"/><text x="580" y="503" fill="white" font-size="22" font-weight="700" text-anchor="middle">Fold 2: Train</text><rect x="715" y="462" width="230" height="65" rx="12" fill="#087e8b"/><text x="830" y="503" fill="white" font-size="22" font-weight="700" text-anchor="middle">Fold 3: Validate</text><text x="500" y="600" fill="#087e8b" font-size="22" font-weight="700" text-anchor="middle">Average validation scores → choose settings → refit → final test</text></g></svg>