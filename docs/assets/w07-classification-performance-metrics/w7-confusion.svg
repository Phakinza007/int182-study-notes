<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 670" width="1000" height="670" role="img" aria-labelledby="title desc"><title id="title">Read the confusion matrix</title><desc id="desc">Rows are actual classes. Columns are predictions. Define the positive class first.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087e8b"/></marker></defs><rect width="1000" height="670" rx="20" fill="#f7fafc"/><g font-family="Arial, sans-serif"><text x="36" y="50" fill="#172c3d" font-size="30" font-weight="700" text-anchor="start">Read the confusion matrix</text><text x="36" y="87" fill="#506477" font-size="20" font-weight="400" text-anchor="start">Rows are actual classes. Columns are predictions. Define the positive class first.</text><text x="410" y="145" fill="#087e8b" font-size="24" font-weight="700" text-anchor="middle">Predicted +</text><text x="735" y="145" fill="#087e8b" font-size="24" font-weight="700" text-anchor="middle">Predicted −</text><text x="32" y="250" fill="#172c3d" font-size="24" font-weight="700" text-anchor="start">Actual +</text><text x="32" y="420" fill="#172c3d" font-size="24" font-weight="700" text-anchor="start">Actual −</text><rect x="225" y="170" width="300" height="140" rx="16" fill="white" stroke="#087e8b" stroke-width="2"/><text x="247" y="208" fill="#087e8b" font-size="25" font-weight="700" text-anchor="start">TP: correct positive</text><text x="247" y="243" fill="#506477" font-size="21" font-weight="400" text-anchor="start">Detected a real</text><text x="247" y="272" fill="#506477" font-size="21" font-weight="400" text-anchor="start">positive</text><rect x="550" y="170" width="300" height="140" rx="16" fill="white" stroke="#c24c45" stroke-width="2"/><text x="572" y="208" fill="#c24c45" font-size="25" font-weight="700" text-anchor="start">FN: missed positive</text><text x="572" y="243" fill="#506477" font-size="21" font-weight="400" text-anchor="start">A real positive was</text><text x="572" y="272" fill="#506477" font-size="21" font-weight="400" text-anchor="start">missed</text><rect x="225" y="340" width="300" height="140" rx="16" fill="white" stroke="#c24c45" stroke-width="2"/><text x="247" y="378" fill="#c24c45" font-size="25" font-weight="700" text-anchor="start">FP: false alarm</text><text x="247" y="413" fill="#506477" font-size="21" font-weight="400" text-anchor="start">Negative called</text><text x="247" y="442" fill="#506477" font-size="21" font-weight="400" text-anchor="start">positive</text><rect x="550" y="340" width="300" height="140" rx="16" fill="white" stroke="#087e8b" stroke-width="2"/><text x="572" y="378" fill="#087e8b" font-size="25" font-weight="700" text-anchor="start">TN: correct negative</text><text x="572" y="413" fill="#506477" font-size="21" font-weight="400" text-anchor="start">Rejected a real</text><text x="572" y="442" fill="#506477" font-size="21" font-weight="400" text-anchor="start">negative</text><text x="225" y="540" fill="#2563eb" font-size="24" font-weight="700" text-anchor="start">Precision = TP / (TP + FP)</text><text x="225" y="581" fill="#087e8b" font-size="24" font-weight="700" text-anchor="start">Recall = TP / (TP + FN)</text><text x="225" y="622" fill="#506477" font-size="24" font-weight="400" text-anchor="start">Specificity = TN / (TN + FP)</text></g></svg>