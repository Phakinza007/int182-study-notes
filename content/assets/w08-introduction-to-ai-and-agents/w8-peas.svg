<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" width="1000" height="570" role="img" aria-labelledby="title desc"><title id="title">PEAS: describe an automated taxi</title><desc id="desc">Define success, context, actions, and observations before designing the agent.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087e8b"/></marker></defs><rect width="1000" height="570" rx="20" fill="#f7fafc"/><g font-family="Arial, sans-serif"><text x="36" y="50" fill="#172c3d" font-size="30" font-weight="700" text-anchor="start">PEAS: describe an automated taxi</text><text x="36" y="87" fill="#506477" font-size="20" font-weight="400" text-anchor="start">Define success, context, actions, and observations before designing the agent.</text><rect x="40" y="140" width="440" height="175" rx="16" fill="white" stroke="#087e8b" stroke-width="2"/><text x="62" y="178" fill="#087e8b" font-size="25" font-weight="700" text-anchor="start">P · Performance</text><text x="62" y="213" fill="#506477" font-size="21" font-weight="400" text-anchor="start">Income, happy customers</text><text x="62" y="242" fill="#506477" font-size="21" font-weight="400" text-anchor="start">Vehicle costs, fines, insurance</text><rect x="520" y="140" width="440" height="175" rx="16" fill="white" stroke="#087e8b" stroke-width="2"/><text x="542" y="178" fill="#087e8b" font-size="25" font-weight="700" text-anchor="start">E · Environment</text><text x="542" y="213" fill="#506477" font-size="21" font-weight="400" text-anchor="start">Roads, other drivers, customers</text><text x="542" y="242" fill="#506477" font-size="21" font-weight="400" text-anchor="start">Weather, police</text><rect x="40" y="350" width="440" height="175" rx="16" fill="white" stroke="#087e8b" stroke-width="2"/><text x="62" y="388" fill="#087e8b" font-size="25" font-weight="700" text-anchor="start">A · Actuators</text><text x="62" y="423" fill="#506477" font-size="21" font-weight="400" text-anchor="start">Steering, brake, accelerator</text><text x="62" y="452" fill="#506477" font-size="21" font-weight="400" text-anchor="start">Display and speaker</text><rect x="520" y="350" width="440" height="175" rx="16" fill="white" stroke="#087e8b" stroke-width="2"/><text x="542" y="388" fill="#087e8b" font-size="25" font-weight="700" text-anchor="start">S · Sensors</text><text x="542" y="423" fill="#506477" font-size="21" font-weight="400" text-anchor="start">Camera, radar, GPS</text><text x="542" y="452" fill="#506477" font-size="21" font-weight="400" text-anchor="start">Accelerometer, engine sensors,</text><text x="542" y="481" fill="#506477" font-size="21" font-weight="400" text-anchor="start">microphone</text></g></svg>