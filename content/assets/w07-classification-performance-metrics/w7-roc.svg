<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-labelledby="title desc"><title id="title">ROC: change the decision threshold</title><desc id="desc">Schematic based on Lecture 7, pp. 44-48; this is not measured model output.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087e8b"/></marker></defs><rect width="1000" height="640" rx="20" fill="#f7fafc"/><g font-family="Arial, sans-serif"><text x="36" y="50" fill="#172c3d" font-size="30" font-weight="700" text-anchor="start">ROC: change the decision threshold</text><text x="36" y="87" fill="#506477" font-size="20" font-weight="400" text-anchor="start">Schematic based on Lecture 7, pp. 44-48; this is not measured model output.</text><path d="M140 500 L890 500" fill="none" stroke="#087e8b" stroke-width="3" marker-end="url(#arrow)"/><path d="M140 500 L140 140" fill="none" stroke="#087e8b" stroke-width="3" marker-end="url(#arrow)"/><path d="M140 500 L840 150" stroke="#94a3b8" stroke-width="2" stroke-dasharray="9 8"/><path d="M140 500 C170 230 330 180 840 150" fill="none" stroke="#2563eb" stroke-width="5"/><text x="100" y="540" fill="#172c3d" font-size="22" font-weight="400" text-anchor="start">0</text><text x="840" y="540" fill="#172c3d" font-size="22" font-weight="400" text-anchor="start">1</text><text x="105" y="160" fill="#172c3d" font-size="22" font-weight="400" text-anchor="start">1</text><text x="480" y="585" fill="#172c3d" font-size="25" font-weight="400" text-anchor="middle">False Positive Rate (FPR)</text><text x="165" y="128" fill="#172c3d" font-size="24" font-weight="400" text-anchor="start">True Positive Rate (Recall)</text><text x="440" y="265" fill="#2563eb" font-size="24" font-weight="400" text-anchor="start">Better ranking</text><text x="495" y="395" fill="#506477" font-size="23" font-weight="400" text-anchor="start">Random baseline: AUC = 0.5</text><text x="180" y="555" fill="#087e8b" font-size="21" font-weight="400" text-anchor="start">Ideal point: (FPR, TPR) = (0, 1)</text></g></svg>