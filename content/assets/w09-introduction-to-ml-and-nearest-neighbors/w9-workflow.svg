<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-labelledby="title desc"><title id="title">Machine learning is an iterative workflow</title><desc id="desc">Based on Introduction to Machine Learning (UofT), slide 26 / PDF p. 19.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087e8b"/></marker></defs><rect width="1000" height="640" rx="20" fill="#f7fafc"/><g font-family="Arial, sans-serif"><text x="36" y="50" fill="#172c3d" font-size="30" font-weight="700" text-anchor="start">Machine learning is an iterative workflow</text><text x="36" y="87" fill="#506477" font-size="20" font-weight="400" text-anchor="start">Based on Introduction to Machine Learning (UofT), slide 26 / PDF p. 19.</text><rect x="40" y="140" width="280" height="160" rx="16" fill="white" stroke="#087e8b" stroke-width="2"/><text x="62" y="178" fill="#087e8b" font-size="25" font-weight="700" text-anchor="start">1 · Define problem</text><text x="62" y="213" fill="#506477" font-size="21" font-weight="400" text-anchor="start">Pattern? Data?</text><text x="62" y="242" fill="#506477" font-size="21" font-weight="400" text-anchor="start">Need ML?</text><path d="M322 220 L350 220" fill="none" stroke="#087e8b" stroke-width="3" marker-end="url(#arrow)"/><rect x="360" y="140" width="280" height="160" rx="16" fill="white" stroke="#087e8b" stroke-width="2"/><text x="382" y="178" fill="#087e8b" font-size="25" font-weight="700" text-anchor="start">2 · Prepare data</text><text x="382" y="213" fill="#506477" font-size="21" font-weight="400" text-anchor="start">Gather and clean</text><text x="382" y="242" fill="#506477" font-size="21" font-weight="400" text-anchor="start">Visualize</text><path d="M642 220 L670 220" fill="none" stroke="#087e8b" stroke-width="3" marker-end="url(#arrow)"/><rect x="680" y="140" width="280" height="160" rx="16" fill="white" stroke="#087e8b" stroke-width="2"/><text x="702" y="178" fill="#087e8b" font-size="25" font-weight="700" text-anchor="start">3 · Set a baseline</text><text x="702" y="213" fill="#506477" font-size="21" font-weight="400" text-anchor="start">Simple reference</text><text x="702" y="242" fill="#506477" font-size="21" font-weight="400" text-anchor="start">to compare against</text><rect x="40" y="355" width="280" height="160" rx="16" fill="white" stroke="#087e8b" stroke-width="2"/><text x="62" y="393" fill="#087e8b" font-size="25" font-weight="700" text-anchor="start">4 · Choose a model</text><text x="62" y="428" fill="#506477" font-size="21" font-weight="400" text-anchor="start">Loss and</text><text x="62" y="457" fill="#506477" font-size="21" font-weight="400" text-anchor="start">regularization</text><path d="M322 435 L350 435" fill="none" stroke="#087e8b" stroke-width="3" marker-end="url(#arrow)"/><rect x="360" y="355" width="280" height="160" rx="16" fill="white" stroke="#087e8b" stroke-width="2"/><text x="382" y="393" fill="#087e8b" font-size="25" font-weight="700" text-anchor="start">5 · Optimize</text><text x="382" y="428" fill="#506477" font-size="21" font-weight="400" text-anchor="start">Fit parameters</text><text x="382" y="457" fill="#506477" font-size="21" font-weight="400" text-anchor="start">to training data</text><path d="M642 435 L670 435" fill="none" stroke="#087e8b" stroke-width="3" marker-end="url(#arrow)"/><rect x="680" y="355" width="280" height="160" rx="16" fill="white" stroke="#087e8b" stroke-width="2"/><text x="702" y="393" fill="#087e8b" font-size="25" font-weight="700" text-anchor="start">6 · Tune + analyze</text><text x="702" y="428" fill="#506477" font-size="21" font-weight="400" text-anchor="start">Hyperparameters</text><text x="702" y="457" fill="#506477" font-size="21" font-weight="400" text-anchor="start">Errors and</text><text x="702" y="486" fill="#506477" font-size="21" font-weight="400" text-anchor="start">performance</text><path d="M820 305 L820 330 L180 330 L180 345" fill="none" stroke="#087e8b" stroke-width="3" marker-end="url(#arrow)"/><text x="500" y="595" fill="#087e8b" font-size="23" font-weight="700" text-anchor="middle">Iterate after error analysis: revisit the model or revisit the data.</text></g></svg>